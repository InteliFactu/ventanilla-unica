# Shared quality hooks mirror createLefthookConfig(); Tadu validates this backlog.
pre-commit:
  parallel: true
  commands:
    tadu-doctor:
      run: |
        if ! command -v tadu >/dev/null 2>&1; then
          printf '%s\n' 'Tadu is required on Git PATH. Install: https://github.com/syntopica/tadu#install' >&2
          exit 127
        fi
        tadu doctor .
    lint:fast:
      glob: '*.{js,jsx,ts,tsx,vue,astro,mjs,cjs}'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    lint:
      glob: '*.{js,jsx,ts,tsx,vue,astro,mjs,cjs}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    format:
      glob: '*.{js,jsx,ts,tsx,vue,astro,mjs,cjs,json,md,css,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}

# The release tooling reads the commit type to pick the semver bump and to
# build the changelog, so a mistyped subject is a silent release defect. This
# is the only place it can be caught: by the time the tag is cut the message
# is already history.
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    secrets:
      run: gitleaks detect --no-banner --redact
